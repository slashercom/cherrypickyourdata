name: Update rolling-returns data

on:
  schedule:
    # Every day at 06:00 UTC. Shiller's file is refreshed roughly monthly but
    # not on a fixed day, so a daily check picks up a new month within hours
    # of it being posted. The job exits without committing when nothing changed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger a rebuild by hand from the Actions tab

permissions:
  contents: write         # needed to commit the regenerated page back to the repo

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data and rebuild page
        run: python build_site.py

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/monthly.csv sitemap.xml robots.txt favicon.svg og-image.png
          if git diff --staged --quiet; then
            echo "No new data - nothing to commit."
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git push
            echo "Published updated data."
          fi
